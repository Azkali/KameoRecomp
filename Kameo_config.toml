# Kameo - ReXGlue Codegen Configuration

project_name = "Kameo"
file_path = "assets/game/default.xex"
out_directory_path = "generated"
window_width = 2560
window_height = 1440
fullscreen = true
present_fsr_quality_mode = "nativeaa"
present_effect = "fsr3"
resolution_upscale = 2

# Most function discovery is handled by the multi-pass gap-fill improvement
# upstream in rexglue-sdk. The hints below cover small thunks that the
# gap-fill phase still absorbs because their parent function's discoverBlocks
# walks a `b` instruction into them as an internal jump (the parent grows
# multi-block to span them) — vtable / function-pointer dispatch needs them
# as standalone entries.
[functions]
0x822F9158 = {}
0x82310CE0 = { size = 0x14 }
0x826BC698 = { size = 0x10 }

# Thunks in the 0x82319000..0x8231B000 region. Identified by dumping the
# region from the live process and decoding post-terminator addresses
# (blr/bctr/unconditional `b`). The codegen GAP_FILL phase absorbs these
# into a multi-block parent because the parent's `b` to them is treated
# as an internal jump (gap-fill entries are not in knownFunctions during
# discoverBlocks).
0x823190B4 = {}
0x82319228 = {}
0x82319238 = {}
0x82319248 = {}
0x8231932C = {}
0x82319460 = {}
